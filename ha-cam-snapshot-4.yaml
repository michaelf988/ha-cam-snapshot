blueprint:
  name: "Camera Event Notification 4.3.0"
  author: "MF"
  homeassistant:
    min_version: 2024.10.0
  description: >
    Szenario-basierte Kamera-Überwachung mit intelligenter Personen-Erkennung.
    Features: 3-stufige Wichtigkeitsanalyse, Video-Verifikation, dynamische Level-Anpassung.

    VERSION 4.3.0:
    - FIX: Cooldown pro Kamera statt global (delay_notification, gleiche Bedeutung in Sekunden).
      Bisher sperrte this.last_triggered alle Kameras, und jeder Trigger (auch ein blockierter)
      verlängerte die Sperre. Schlüssel ist jetzt die aufgelöste Kamera; Kamera-Trigger und
      zugehöriger Bewegungssensor teilen sich den Cooldown. Ohne Helper zählt die Pause seit dem
      letzten Ende der Bewegung auf dem auslösenden Sensor (trigger.from_state.last_changed).
      Neuer optionaler Input cooldown_store (input_text) für einen exakten Zeitstempel pro Kamera.
      Blockierte Läufe enden sofort per stop; Details stehen im Trace in der Variable 'cooldown'.
    - OPT: mode parallel (max 10, max_exceeded: warning) statt queued (max 25, silent). Das
      abschließende 'delay: 5' ist ersatzlos entfernt (kein belegbarer Zweck, es serialisierte nur
      alle Kameras). max 10 begrenzt gleichzeitige LLM-Aufrufe und RTSP-Sessions am NVR; mehr als
      10 gleichzeitige Läufe bedeuten mehrere Kameras im Dauer-Trigger und landen als Warnung im Log.
    - HINWEIS Race-Conditions: (1) Kommen zwei Trigger derselben Kamera im selben Tick, bevor der
      erste Lauf seinen Stempel geschrieben hat, laufen beide (Store-Modus ist kein atomares
      Read-Modify-Write). Kamera-Trigger + Sensor im selben Tick sind abgedeckt: der früher
      aktive gewinnt, bei Gleichstand der Bewegungssensor. (2) Schreiben zwei Kameras gleichzeitig
      in den Store, kann ein Stempel verloren gehen; diese Kamera darf dann einmal früher melden.
      (3) Dauert ein Lauf länger als der Cooldown (Video + Alarm-Wiederholungen), kann dieselbe
      Kamera erneut starten; camera.record schlägt dann fehl ('already recording'), bricht aber
      dank continue_on_error nicht mehr ab.
    - FIX: continue_on_error bei camera.snapshot, camera.record (auch in parallel) und
      llmvision.image_analyzer. Eine Exception im image_analyzer führt zu importance_status
      no_response und damit zu einer Push-Nachricht mit Level probably-person. Achtung:
      continue_on_error fängt nur HomeAssistantError ab, keine Konfigurations- oder Template-Fehler.
    - FIX: Wichtigkeitsanalyse läuft nur mit Snapshot. Snapshot im Szenario aus -> disabled.
      Kamera beim Trigger unavailable/unknown -> kein API-Aufruf, no_response (probably-person).
      Das Push-Attachment wird nur gesetzt, wenn ein Snapshot erstellt wurde.
    - FIX: Template-Fehler bei detection_level 'none' (Analyse aus) in Video-, LG-TV- und
      Other-Notify-Schwelle behoben. 'none' hat Rang 0: Schwellen probably-/definitely-person gelten
      bei deaktivierter Analyse als NICHT erreicht.
    - FIX: Moderne Syntax (triggers:, trigger: state, actions:) und not_from: [unavailable, unknown]
      an beiden Triggern. Ein NVR-Reconnect löst keinen Fehlalarm mehr aus. min_version bleibt
      2024.10.0 (ab dieser Version gilt die neue Syntax).
    - FIX: Dateinamen enthalten die Instanz (this.entity_id). Mehrere Instanzen im selben Verzeichnis
      überschreiben sich nicht mehr. Nie zwei Instanzen mit Video auf denselben Kameras gleichzeitig
      aktiv betreiben: den Recording-Konflikt kann der Blueprint nicht über Instanzen hinweg sperren.
    - FIX: source_url zeigt auf ha-cam-snapshot-4.yaml (vorher 404 auf ha-cam-snapshot-new.yaml).
    - SECURITY: Alles unter /config/www ist über /local/... ohne Anmeldung abrufbar. Neuer Input
      filename_random_suffix (Default an) hängt 12 Zufallszeichen an jeden Dateinamen. Liegt
      snapshot_dir_fs unter /media, wird die URL als /media/local/... abgeleitet (nur mit Anmeldung)
      und snapshot_dir_web ignoriert. Default für snapshot_dir_fs ist jetzt /media/snapshots.
    - OPT: importance_target_width und video_target_width max 1568 statt 3840 (Claude skaliert
      serverseitig auf ca. 1568 px lange Kante). Default bleibt 1280.
    - NEU: action1_id bis action4_id (Default ACTION_1..4). Eindeutige IDs wie CEN_PAUSE_1H
      empfohlen, weil mobile_app_notification_action ein globales Event ist. Die Action-Liste wird
      nur noch einmal gebaut und in Step 4 und Step 8 verwendet.
    - CLEANUP: Interne Variable lg_tv_entities heißt jetzt lg_tv_notify_services. Debug-Tag zeigt
      zusätzlich Kamera und Cooldown-Ergebnis, z. B. (S3 | garten | cd:sensor 42s | img:no-person | passive).
      '| bool' konsequent auch bei debug_info_enabled, timestamp_filenames und action*_enabled.
    - BREAKING: Instanzen OHNE explizit gesetztes snapshot_dir_fs speichern jetzt unter /media/snapshots
      (vorher /config/www/snapshots, öffentlich). Explizit gesetzte www-Pfade laufen unverändert weiter.
    - BREAKING: Dateinamen haben jetzt die Form <zeitstempel>_<instanz>_<zufall>.jpg/.mp4. Wer mit
      timestamp_filenames: false auf eine feste Datei 'last_motion.jpg' verweist, findet sie jetzt als
      last_motion_<instanz>.jpg (mit filename_random_suffix: false) bzw. gar nicht mehr fest benannt.
    - BREAKING: Werte über 1568 bei importance_target_width/video_target_width sind im UI nicht mehr
      einstellbar. HA validiert Blueprint-Inputs beim Laden nicht gegen den Selector, bestehende Werte
      laufen weiter; beim nächsten Speichern im UI auf <= 1568 setzen.
    - MIGRATION: Input lg_tv_entities (seit 4.0.6 ersetzt) aus den Instanzen entfernen. HA ignoriert
      ihn (unbekannte Inputs erzeugen keinen Fehler), er hat keine Wirkung.
    - MIGRATION: Speicherpfad auf /media/cam_events/<instanz> umstellen, alte Dateien unter
      /config/www/... löschen. action*_id auf eindeutige IDs umstellen und die Actions-Automation
      in einer Übergangsphase auf alte und neue IDs hören lassen (bereits zugestellte Notifications
      behalten ACTION_n). Nach ca. einer Woche die alten ACTION_n-Trigger dort entfernen.
    - HINWEIS: Ein per continue_on_error abgefangener Fehler erscheint weiterhin als ERROR im Log
      ('Error executing script ...'), der Lauf läuft aber weiter.
    - HINWEIS: Für die Analyse von Häufungen in der Instanz stored_traces >= 50 setzen.

    VERSION 4.2.2:
    - NEU: Vierter Action Button (action4_*) analog zu Button 1-3. Hinweis: iOS zeigt pro
      Notification maximal 4 Action Buttons an - mehr als 4 gleichzeitig aktivierte Buttons
      werden auf iOS nicht dargestellt.

    VERSION 4.2.1:
    - UX: Debug-Tag zeigt jetzt die Analyse-Quelle des Ergebnisses.
      Initial-Push: (S3 | img:probably-person | passive)
      Update-Push:  (S3 | img:probably-person → vid:definitely-person | time-sensitive | 1x)
      'vid' = Ergebnis stammt aus Video-Analyse, 'img' = aus Bild-Analyse, 'skip' = Analyse deaktiviert.

    VERSION 4.2.0:
    - BREAKING: Erfordert LLMVision >= 1.7.0.
    - NEU: label-Parameter in llmvision.create_event - Timeline-Events werden als 'Person' oder
      'Camera' klassifiziert (basierend auf verified_detection), kompatibel mit get_events-Filter.
    - BUGFIX: Doppeltes continue_on_error im create_event-Aufruf entfernt (ungültiges YAML).
    - FIX: {{ now().strftime('%H:%M') }} aus den Prompt-Defaults entfernt (wurde als Literal-String
      an das LLM gesendet statt als ausgewertete Uhrzeit). Zeitangabe wird jetzt direkt im
      message-Template vor dem Prompt eingefügt.

    VERSION 4.1.1:
    - BUGFIX: store_in_timeline | bool in Step 5b (llmvision.create_event wurde immer ausgeführt,
      auch wenn store_in_timeline: false gesetzt war).
    - BUGFIX: Update-Push zeigt jetzt "Bewegung erkannt" statt leerem Text wenn video_result leer ist.
    - CLEANUP: Tote Variable response (response_text) aus dem Variables-Block entfernt.

    VERSION 4.1.0:
    - BUGFIX: Gate-Check nutzt jetzt current_gate_enable | bool (Gate konnte fälschlicherweise
      Automation stoppen, auch wenn gate_enable: false gesetzt war).
    - BUGFIX: current_tv_notify | bool in lg_tv_should_send und other_notify_should_send
      (TV/Other-Notify sendete trotz s_tv_notify: false im aktiven Szenario).
    - BUGFIX: store_in_timeline direkt als boolean übergeben statt als gerenderter String.
    - FIX: Cooldown-Check nutzt .total_seconds() statt .seconds für korrekte Semantik.

    VERSION 4.0.9:
    - BUGFIX: Jinja2 Boolean-Truthiness-Bug behoben. Python-Booleans (False/True) werden als nicht-leere Strings
      gerendert ("False"/"True"), die in Jinja2 immer truthy sind. Dadurch liefen Video-Aufnahme, Video-Analyse,
      Wichtigkeitsanalyse und andere Blöcke auch wenn sie deaktiviert waren. Fix: | bool Filter an allen
      boolean-Checks (current_video, current_snapshot, current_importance, current_mobile_push,
      current_tts_enable, video_should_run, lg_tv_should_send, other_notify_should_send, current_alarm_mode).

    VERSION 4.0.8:
    - FIX: lg_tv_notify_services zurück auf select/custom_value (entity-Selektor funktioniert nicht für Legacy-Notify-Services ohne Entity-Eintrag).
    - Notify-Service-Name manuell eingeben, z.B. notify.lg_webos_smart_tv_wohnzimmer.

    VERSION 4.0.6:
    - FIX: LG WebOS TV Benachrichtigungen nutzen jetzt direkt Notify-Service-Namen statt Media-Player-Entitäten.
    - INPUT: lg_tv_entities → lg_tv_notify_services (select mit custom_value, z.B. notify.lg_webos_smart_tv_wohnzimmer).
    - ACTION: Kein fragiler String-Replace mehr (media_player.xxx → notify.xxx), stattdessen direkter Aufruf.

    VERSION 4.0.0:
    - BREAKING: Erfordert LLMVision >= 1.6.0.
    - NEU: Structured Output (JSON) für zuverlässigere Klassifizierung bei Wichtigkeits- und Video-Analyse.
    - NEU: store_in_timeline ersetzt den separaten remember-Schritt (alte llmvision.remember Action entfernt).
    - NEU: expose_images bei Analyzern für Timeline-kompatible Snapshots.
    - UPDATE: remember → store_in_timeline (Breaking Change in LLMVision 1.6.0).
    - UPDATE: generate_title wird nur noch bei store_in_timeline genutzt.
    - ENTFERNT: Separater llmvision.remember Schritt (Step 9) - wird jetzt direkt über die Analyzer abgewickelt.
    - CODE: YAML-Anchors genutzt, um Redundanz in den Input-Descriptions zu reduzieren.

  domain: automation
  source_url: https://github.com/michaelf988/ha-cam-snapshot/blob/main/ha-cam-snapshot-4.yaml

  input:
    # =======================
    # 0. DEBUGGING
    # =======================
    debug_info_enabled:
      name: "🐞 Debug-Infos in Nachrichten anzeigen"
      description: >
        Fügt technische Details (Szenario, Kamera, Cooldown-Ergebnis, Level, API-Versuche) an das Ende
        der Push-Nachricht an. Tipp: Für die Analyse von Häufungen in der Instanz-YAML
        'trace: stored_traces: 50' (oder mehr) setzen, Standard sind nur 5 Traces.
      default: false
      selector:
        boolean: {}

    # =======================
    # 1. KAMERAS & SENSOREN
    # =======================
    cameras_section:
      name: "Kameras & Sensoren"
      description: "Konfiguration der Auslöser."
      icon: mdi:camera
      collapsed: true
      input:
        camera_entities:
          name: "Kamera Entitäten"
          description: "Wähle eine oder mehrere Kameras aus, von denen Bilder/Videos stammen sollen."
          selector:
            entity:
              multiple: true
              filter:
                domain: camera

        trigger_state:
          name: "Trigger Status"
          description: "Startet, wenn die Kamera in diesen Zustand wechselt (z.B. 'recording')."
          default: "recording"
          selector:
            text:

        motion_sensors:
          name: "Bewegungsmelder (optional)"
          description: "Alternativer Auslöser. Muss exakt der Reihenfolge der Kameras entsprechen."
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor

    # =======================
    # 2. SPEICHERUNG
    # =======================
    storage_section:
      name: "Speicherung"
      description: "Dateipfade und Namensgebung."
      icon: mdi:folder
      collapsed: true
      input:
        timestamp_filenames:
          name: "Zeitstempel in Dateinamen nutzen"
          default: true
          selector:
            boolean:
            
        timestamp_format:
          name: "Zeitstempel-Format"
          default: "%Y-%m-%d_%H-%M-%S"
          selector:
            text:

        snapshot_dir_fs:
          name: "Basis-Pfad (Dateisystem)"
          description: >
            Empfohlen: ein Pfad unter /media, z. B. /media/cam_events/<instanz>. Dateien dort sind nur
            mit Anmeldung abrufbar (/media/local/...), die Web-URL wird automatisch abgeleitet.
            ACHTUNG: Alles unter /config/www ist über /local/... OHNE Anmeldung aus dem Netz abrufbar.
            Seit 4.3.0 ist der Default /media/snapshots (vorher /config/www/snapshots).
          default: "/media/snapshots"
          selector:
            text:
            
        snapshot_dir_web:
          name: "Basis-Pfad (Web)"
          description: >
            Nur relevant, wenn der Dateisystem-Pfad NICHT unter /media liegt (z. B. /config/www/x -> /local/x).
            Bei /media-Pfaden wird dieser Wert ignoriert und /media/local/... verwendet.
          default: "/local/snapshots"
          selector:
            text:

        filename_random_suffix:
          name: "Zufalls-Suffix im Dateinamen"
          description: >
            Hängt 12 zufällige Zeichen (a-z, 0-9) an jeden Dateinamen an, damit Snapshot- und Video-URLs nicht
            erratbar sind. Wichtig, solange Dateien unter /config/www (/local) liegen. Nur deaktivieren, wenn ein
            fester Dateiname (z. B. 'last_motion') gebraucht wird und die Dateien unter /media liegen.
          default: true
          selector:
            boolean:

    # =======================
    # 3. AI GRUNDEINSTELLUNGEN
    # =======================
    ai_base_section:
      name: "AI Grundeinstellungen"
      description: "Verbindung zum LLM Vision Provider."
      icon: mdi:brain
      collapsed: true
      input:
        provider:
          name: "AI Provider"
          selector:
            config_entry:
              integration: llmvision

        model:
          name: "AI Model"
          default: "gpt-4o-mini"
          selector:
            text:

        store_in_timeline:
          name: "Events in Timeline speichern"
          description: "Speichert analysierte Events in der LLM Vision Timeline. Ersetzt den bisherigen 'remember'-Schritt."
          default: true
          selector:
            boolean:

    # =======================
    # 3a. VIDEO-AUFNAHME EINSTELLUNGEN
    # =======================
    video_recording_section:
      name: "Video-Aufnahme Einstellungen"
      icon: mdi:video
      collapsed: true
      input:
        video_duration:
          name: "Video-Dauer (Sekunden)"
          default: 5
          selector:
            number:
              min: 1
              max: 30
              unit_of_measurement: seconds

        video_lookback:
          name: "Video-Rückblick (Sekunden)"
          default: 5
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: seconds

    # =======================
    # 3b. WICHTIGKEITS-ANALYSE
    # =======================
    importance_analysis_section:
      name: "Wichtigkeits-Analyse (Snapshot)"
      icon: mdi:image-search
      collapsed: true
      input:
        importance_target_width:
          name: "Bild-Breite (Pixel)"
          description: &desc_target_width >
            Zielbreite, auf die LLM Vision die Bilder vor dem Upload skaliert. Empfehlung 1280.
            Claude skaliert serverseitig auf höchstens ca. 1568 px lange Kante herunter, OpenAI (high detail)
            und Ollama/MiniCPM-V nutzen ebenfalls nicht mehr. Größere Werte kosten nur Upload-Zeit und Latenz.
            Seit 4.3.0 ist das Maximum 1568.
          default: 1280
          selector:
            number:
              min: 512
              max: 1568

        importance_max_tokens:
          name: "Max Tokens"
          default: 4000
          selector:
            number:
              min: 1
              max: 15000

        importance_max_retries:
          name: "Max Versuche"
          default: 2
          selector:
            number:
              min: 1
              max: 10

        importance_retry_delay:
          name: "Pause zwischen Versuchen"
          default: { seconds: 1 }
          selector:
            duration: {}

        importance_prompt:
          name: "Wichtigkeits-Analyse Prompt"
          default: >
            CONTEXT: Security camera snapshot from a private property surveillance system.

            TASK: Analyze this single frame for human presence.
            
            CLASSIFICATION:
            - "no-person" = No human detected, no security concern
            - "probably-person" = Unclear, possibly a person, shadows or partial view
            - "definitely-person" = Clear human presence detected
            
            Consider: Body shape, movement patterns typical of humans, size relative to environment.
            Ignore: Pets, vehicles (unless person visible inside), shadows without clear human form.
            
            Respond with your classification in the required JSON format.
          selector:
            text:
              multiline: true

    # =======================
    # 3c. VIDEO-ANALYSE
    # =======================
    video_analysis_section:
      name: "Video-Analyse (Verifikation)"
      icon: mdi:video-check
      collapsed: true
      input:
        video_target_width:
          name: "Bild-Breite (Pixel)"
          description: *desc_target_width
          default: 1280
          selector:
            number:
              min: 512
              max: 1568

        video_max_frames:
          name: "Max Frames"
          default: 3
          selector:
            number:
              min: 1
              max: 10

        video_max_tokens:
          name: "Max Tokens"
          default: 5000
          selector:
            number:
              min: 1
              max: 15000

        video_max_retries:
          name: "Max Versuche"
          default: 3
          selector:
            number:
              min: 1
              max: 10

        video_retry_delay:
          name: "Pause zwischen Versuchen"
          default: { seconds: 2 }
          selector:
            duration: {}

        video_prompt:
          name: "Video-Analyse Prompt"
          default: >
            CONTEXT: Security camera video recording from private property.

            TASK: Analyze the video sequence for HUMAN presence.
            
            CLASSIFICATION:
            - "definitely-person" = Clear human presence (single or multiple)
            - "probably-person" = Unclear, possibly a person, bad lighting
            - "no-person" = No human visible (includes pets, vehicles, wind, no motion)
            
            INSTRUCTIONS:
            - If you see a vehicle BUT NO PERSON inside/outside: choose "no-person".
            - If you see an animal BUT NO PERSON: choose "no-person".
            - Only choose "definitely-person" if you are sure it is a human.
            
            Respond with your classification in the required JSON format.
          selector:
            text:
              multiline: true

    # =======================
    # 4. TTS GRUNDEINSTELLUNGEN
    # =======================
    tts_base_section:
      name: "Text-to-Speech Grundeinstellungen"
      icon: mdi:volume-high
      collapsed: true
      input:
        tts_target_entity:
          name: "TTS Service"
          selector:
            entity:
              filter:
                domain: tts

        tts_media_players:
          name: "Lautsprecher für TTS"
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: media_player

        tts_volume:
          name: "TTS Lautstärke"
          default: 0.7
          selector:
            number:
              min: 0
              max: 1
              step: 0.05

        tts_repeat_count:
          name: "TTS Wiederholungen"
          default: 3
          selector:
            number:
              min: 1
              max: 10

        tts_repeat_delay:
          name: "Pause zwischen Wiederholungen"
          default: { seconds: 2 }
          selector:
            duration: {}

    # =======================
    # 5. MOBILE BENACHRICHTIGUNGEN
    # =======================
    mobile_notifications_section:
      name: "Mobile Benachrichtigungen"
      icon: mdi:cellphone
      collapsed: true
      input:
        notify_device:
          name: "Mobile Geräte"
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app

        tap_navigate:
          name: "Tap / Click Action Path"
          default: "/lovelace/cameras"
          selector:
            text:

        delay_notification:
          name: "Cooldown pro Kamera (Sekunden)"
          description: >
            Mindestabstand zwischen zwei Läufen DERSELBEN Kamera (seit 4.3.0 pro Kamera statt global).
            Kamera-Trigger und zugehöriger Bewegungssensor teilen sich den Cooldown.
            Ohne Cooldown-Speicher gilt: Es zählt die Mindestpause seit dem letzten Ende der Bewegung auf dem
            auslösenden Sensor (Zeit im Zustand 'off' vor dem neuen 'on'). Ein Sensor, der dauerhaft schneller
            als der Cooldown pulsiert, bleibt dadurch stumm. Für einen exakten Abstand seit der letzten Meldung
            den Cooldown-Speicher setzen. 0 = kein Cooldown.
          default: 15
          selector:
            number:
              min: 0
              max: 600
              unit_of_measurement: seconds

        cooldown_store:
          name: "Cooldown-Speicher (optional)"
          description: >
            Optionaler input_text-Helper (max: 255) für einen exakten Cooldown pro Kamera. Gespeichert wird
            '<Kamera-Index>:<Epoch-Sekunden>' pro Kamera, kommagetrennt, nur solange der Cooldown läuft.
            Eigenen Helper pro Instanz verwenden. Leer = Cooldown über die Sensor-Pause (siehe oben).
          default: ""
          selector:
            entity:
              filter:
                domain: input_text

        alarm_repetition_count:
          name: "Alarm-Wiederholungen (Anzahl)"
          default: 5
          selector:
            number:
              min: 1
              max: 20

        alarm_repetition_delay:
          name: "Pause zwischen Alarm-Wiederholungen"
          default: { seconds: 3 }
          selector:
            duration: {}

    # =======================
    # 5a. BENACHRICHTIGUNGSTÖNE
    # =======================
    notification_sounds_section:
      name: "Benachrichtigungstöne"
      icon: mdi:bell-ring
      collapsed: true
      input:
        notification_sound:
          name: "Ton (Normal)"
          default: "LiquidDetected.caf"
          selector:
            text:

        notification_volume:
          name: "Lautstärke (Normal)"
          default: 0.7
          selector:
            number:
              min: 0
              max: 1
              step: 0.1

        notification_sound_critical:
          name: "Ton (Critical)"
          default: "alarm.caf"
          selector:
            text:

        notification_volume_critical:
          name: "Lautstärke (Critical)"
          default: 1.0
          selector:
            number:
              min: 0
              max: 1
              step: 0.1

    # =======================
    # 5b. ACTION BUTTONS
    # =======================
    action_buttons_section:
      name: "Action Buttons"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        action1_enabled:
          name: "Button 1 aktivieren"
          default: true
          selector:
            boolean:
        action1_id:
          name: "Button 1 Action-ID"
          description: &desc_action_id >
            ID, die beim Tippen im Event mobile_app_notification_action ankommt. Das Event ist global,
            daher eindeutige IDs empfohlen, z. B. CEN_PAUSE_1H. Default ACTION_1..4 nur aus Kompatibilität.
          default: "ACTION_1"
          selector:
            text:
        action1_title:
          name: "Button 1 Text"
          default: "Öffnen"
          selector:
            text:
        action1_uri:
          name: "Button 1 URI (optional)"
          default: ""
          selector:
            text:
        action1_icon:
          name: "Button 1 Icon (optional)"
          default: ""
          selector:
            text:
        action1_destructive:
          name: "Button 1 Rot markieren"
          default: false
          selector:
            boolean:

        action2_enabled:
          name: "Button 2 aktivieren"
          default: true
          selector:
            boolean:
        action2_id:
          name: "Button 2 Action-ID"
          description: *desc_action_id
          default: "ACTION_2"
          selector:
            text:
        action2_title:
          name: "Button 2 Text"
          default: "Snooze 15min"
          selector:
            text:

  camera_entity_snapshot: >
    {% if trigger is defined and trigger.entity_id is defined and trigger.entity_id %}
      {% set tid = trigger.entity_id %}
      {% if tid.startswith('binary_sensor') and (tid in motion_sensors_list) %}
        {% set i = motion_sensors_list.index(tid) %}
        {{ camera_entities_list[i] if camera_entities_list|length > i else (camera_entities_list[0] if camera_entities_list|length>0 else '') }}
      {% elif tid.startswith('camera.') %}
        {{ tid }}
      {% else %}
        {{ camera_entities_list[0] if camera_entities_list|length>0 else '' }}
      {% endif %}
    {% else %}
      {{ camera_entities_list[0] if camera_entities_list|length>0 else '' }}
    {% endif %}
  
  camera_friendly: "{{ state_attr(camera_entity_snapshot, 'friendly_name') or 'Kamera' }}"
  camera_file_path: "{{ camera_friendly | slugify }}"
  # Instanz-Kennung im Dateinamen (4.3.0): Mehrere Instanzen im selben Verzeichnis überschreiben sich nicht mehr.
  instance_slug: "{{ ((this.entity_id if (this is defined and this.entity_id is defined) else 'automation.cen') | replace('automation.', '')) }}"
  snapshot_dir_fs_final: "{{ (snapshot_dir_fs_base.rstrip('/')) ~ '/' ~ camera_file_path }}"
  # Web-Pfad (4.3.0): Liegt der Dateisystem-Pfad unter /media, wird die URL daraus abgeleitet
  # (/media/X -> /media/local/X, Standard-Mapping media_dirs local: /media, nur mit Anmeldung abrufbar).
  # Sonst wie bisher snapshot_dir_web (www/local-Pfade bleiben kompatibel, aber öffentlich).
  snapshot_dir_web_final: >
    {% set fs = snapshot_dir_fs_base.rstrip('/') %}
    {% if fs == '/media' or fs.startswith('/media/') %}
      {{ '/media/local' ~ fs[6:] ~ '/' ~ camera_file_path }}
    {% else %}
      {{ (snapshot_dir_web_base.rstrip('/')) ~ '/' ~ camera_file_path }}
    {% endif %}
  
  # Dateiname (4.3.0): <zeitstempel|last_motion>_<instanz>[_<12 Zufallszeichen a-z0-9>]
  # Der Zufallsteil macht Dateinamen unter /local nicht mehr erratbar (filename_random_suffix).
  filename_base: >
    {% set base = now().strftime(timestamp_format) if (timestamp_filenames | bool) else 'last_motion' %}
    {% set ns = namespace(sfx='') %}
    {% if filename_random_suffix | bool %}
      {% for i in range(12) %}{% set ns.sfx = ns.sfx ~ ('abcdefghijklmnopqrstuvwxyz0123456789' | random) %}{% endfor %}
    {% endif %}
    {{ base ~ '_' ~ instance_slug ~ (('_' ~ ns.sfx) if ns.sfx else '') }}
  
  snapshot_filename: "{{ filename_base ~ '.jpg' }}"
  file_path: "{{ snapshot_dir_fs_final ~ '/' ~ snapshot_filename }}"
  snapshot_access_file_path: "{{ snapshot_dir_web_final ~ '/' ~ snapshot_filename }}"
  
  video_filename: "{{ filename_base ~ '.mp4' }}"
  video_file_path: "{{ snapshot_dir_fs_final ~ '/' ~ video_filename }}"
  
  label: "Bewegung erkannt"
  camera: "{{ camera_friendly }}"
  notification_tag: "{{ camera_file_path ~ '_' ~ now().timestamp()|int }}"
  
  level_rank: "{{ {'passive':0,'active':1,'time-sensitive':2,'critical':3} }}"
  detection_rank: "{{ {'no-person':0,'probably-person':1,'definitely-person':2} }}"
  
  device_name_map: >
    {% set ns = namespace(device_names=[]) %}
    {% for dev in (notify_devices or []) %}
      {% set name = device_attr(dev, 'name') | default('', true) %}
      {% set slug = (name | slugify) | default('', true) %}
      {% if slug and (slug | length > 0) %}
        {% set ns.device_names = ns.device_names + ['mobile_app_' ~ slug] %}
      {% endif %}
    {% endfor %}
    {{ ns.device_names }}
  
  notify_services_all: "{{ device_name_map }}"

# 4.3.0: parallel statt queued. Kameras blockieren sich nicht mehr gegenseitig; Doppel-Läufe
# derselben Kamera verhindert der Cooldown pro Kamera (Step 0a). max 10 begrenzt gleichzeitige
# LLM-Aufrufe und RTSP-Sessions am NVR (siehe Changelog). Verwerfen wird als Warnung geloggt.
mode: parallel
max: 10
max_exceeded: warning

# 4.3.0: Moderne Syntax + not_from, damit ein NVR-Reconnect (unavailable/unknown -> on) nicht auslöst.
triggers:
  - trigger: state
    entity_id: !input camera_entities
    to: !input trigger_state
    not_from:
      - unavailable
      - unknown
    id: "camera_trigger"
  - trigger: state
    entity_id: !input motion_sensors
    to: "on"
    not_from:
      - unavailable
      - unknown
    id: "motion_sensor_trigger"

actions:
  # Step 0a: Cooldown pro Kamera (4.3.0)
  # Schlüssel ist die aufgelöste Kamera (camera_entity_snapshot), nicht die Trigger-Entity.
  # Modus 'sensor' (Default, ohne Helper): Pause seit dem letzten Zustandswechsel der auslösenden
  #   Entity (trigger.from_state.last_changed), bei Bewegungssensoren also seit dem letzten Ende der Bewegung.
  # Modus 'store' (cooldown_store gesetzt): exakter Zeitstempel pro Kamera im input_text,
  #   Format "<index>:<epoch>,<index>:<epoch>" (nur Einträge, deren Cooldown noch läuft).
  # In beiden Modi: Ist eine andere Trigger-Entity DERSELBEN Kamera (Kamera-Trigger bzw. zugehöriger
  #   Bewegungssensor) innerhalb des Cooldowns FRÜHER aktiv geworden, gilt der Lauf als Duplikat.
  # Rest-Race: Siehe Changelog 4.3.0 (Store-Modus ist kein atomares Read-Modify-Write).
  - variables:
      cooldown: >
        {% set cd = delay_notification | float(0) %}
        {% set tid = trigger.entity_id if (trigger is defined and trigger.entity_id is defined and trigger.entity_id) else '' %}
        {% set trig_id = trigger.id if (trigger is defined and trigger.id is defined) else '' %}
        {% set t_now = as_timestamp(now()) %}
        {% set t_trig = as_timestamp(trigger.to_state.last_changed, t_now) if (tid and trigger.to_state is defined and trigger.to_state) else t_now %}
        {% set cams = camera_entities_list or [] %}
        {% set key = (cams.index(camera_entity_snapshot) | string) if camera_entity_snapshot in cams else (camera_entity_snapshot | replace('camera.', '')) %}
        {% set store = cooldown_store_entity | default('', true) %}
        {% set store_ok = store is string and store.startswith('input_text.') and state_attr(store, 'max') is not none %}
        {% set mode = 'off' if cd <= 0 else ('store' if store_ok else 'sensor') %}
        {% set ns = namespace(last=none, sib='') %}
        {% if mode == 'store' %}
          {% for e in states(store).split(',') %}
            {% set p = e.split(':') %}
            {% if p | length == 2 and p[0] == key %}{% set ns.last = p[1] | float(0) %}{% endif %}
          {% endfor %}
        {% elif mode == 'sensor' and tid and trigger.from_state is defined and trigger.from_state %}
          {% set ns.last = as_timestamp(trigger.from_state.last_changed, none) %}
        {% endif %}
        {% if mode != 'off' %}
          {% set sibs = namespace(list=[]) %}
          {% for m in (motion_sensors_list or []) %}
            {% set i = loop.index0 %}
            {% set c = cams[i] if cams | length > i else (cams[0] if cams | length > 0 else '') %}
            {% if c == camera_entity_snapshot and m != tid %}{% set sibs.list = sibs.list + [m] %}{% endif %}
          {% endfor %}
          {% if camera_entity_snapshot in cams and camera_entity_snapshot != tid %}{% set sibs.list = sibs.list + [camera_entity_snapshot] %}{% endif %}
          {% for s in sibs.list if not ns.sib %}
            {% set active = trigger_state if s.startswith('camera.') else 'on' %}
            {% set so = expand(s) %}
            {% if is_state(s, active) and so | length > 0 %}
              {% set st = as_timestamp(so[0].last_changed, 0) %}
              {% if (t_trig - st) < cd and (st < t_trig or (st == t_trig and trig_id == 'camera_trigger')) %}{% set ns.sib = s %}{% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set elapsed = (t_trig - ns.last) if ns.last is not none else none %}
        {% set ok = mode == 'off' or ((elapsed is none or elapsed > cd) and not ns.sib) %}
        {% if mode == 'off' %}{% set detail = 'off' %}
        {% elif ns.sib %}{% set detail = mode ~ ' dup:' ~ ns.sib %}
        {% elif elapsed is none %}{% set detail = mode ~ ' neu' %}
        {% else %}{% set detail = mode ~ ' ' ~ (elapsed | int) ~ 's' %}{% endif %}
        {{ {'ok': ok, 'mode': mode, 'camera': camera_entity_snapshot, 'key': key, 'trigger_entity': tid,
            'elapsed': (elapsed | round(1)) if elapsed is not none else none, 'cooldown': cd,
            'sibling': ns.sib, 'store': store if store_ok else '', 'detail': detail} }}
      debug_camera_info: "{{ camera_entity_snapshot | replace('camera.', '') }}"

  - if:
      - condition: template
        value_template: "{{ not (cooldown.ok | bool) }}"
    then:
      - stop: "Cooldown aktiv für diese Kamera. Details (Kamera, Modus, vergangene Sekunden, Duplikat) in der Variable 'cooldown'."

  # Stempel setzen: erste Aktion nach bestandenem Cooldown (nur Store-Modus).
  # Abgelaufene Einträge werden verworfen, der eigene Eintrag steht vorne (übersteht ein Kürzen auf 'max').
  - if:
      - condition: template
        value_template: "{{ cooldown.mode == 'store' }}"
    then:
      - action: input_text.set_value
        continue_on_error: true
        target:
          entity_id: "{{ cooldown.store }}"
        data:
          value: >
            {% set cd = cooldown.cooldown | float(0) %}
            {% set t = as_timestamp(now()) %}
            {% set ns = namespace(items=[cooldown.key ~ ':' ~ (t | int)]) %}
            {% for e in states(cooldown.store).split(',') %}
              {% set p = e.split(':') %}
              {% if p | length == 2 and p[0] != cooldown.key and (t - (p[1] | float(0))) < cd %}
                {% set ns.items = ns.items + [p[0] ~ ':' ~ p[1]] %}
              {% endif %}
            {% endfor %}
            {{ (ns.items | join(','))[:(state_attr(cooldown.store, 'max') | int(255))] }}

  # Step 0b: Szenario-Bestimmung
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ scenario_helper and is_state(scenario_helper, 'on') }}"
        sequence:
          - variables:
              active_scenario: "6"
      - conditions: !input s1_conditions
        sequence:
          - variables:
              active_scenario: "1"
      - conditions: !input s2_conditions
        sequence:
          - variables:
              active_scenario: "2"
      - conditions: !input s3_conditions
        sequence:
          - variables:
              active_scenario: "3"
      - conditions: !input s4_conditions
        sequence:
          - variables:
              active_scenario: "4"
      - conditions: !input s4a_conditions
        sequence:
          - variables:
              active_scenario: "4a"
      - conditions: !input s5_conditions
        sequence:
          - variables:
              active_scenario: "5"
      - conditions: !input s6_conditions
        sequence:
          - variables:
              active_scenario: "6"
    default:
      - variables:
          active_scenario: !input scenario_fallback
  
  # Load scenario settings
  - variables:
      current_snapshot: >
        {% if active_scenario == '1' %}{{ s1_snapshot }}
        {% elif active_scenario == '2' %}{{ s2_snapshot }}
        {% elif active_scenario == '3' %}{{ s3_snapshot }}
        {% elif active_scenario == '4' %}{{ s4_snapshot }}
        {% elif active_scenario == '4a' %}{{ s4a_snapshot }}
        {% elif active_scenario == '5' %}{{ s5_snapshot }}
        {% elif active_scenario == '6' %}{{ s6_snapshot }}
        {% else %}true{% endif %}
      current_video: >
        {% if active_scenario == '1' %}{{ s1_video }}
        {% elif active_scenario == '2' %}{{ s2_video }}
        {% elif active_scenario == '3' %}{{ s3_video }}
        {% elif active_scenario == '4' %}{{ s4_video }}
        {% elif active_scenario == '4a' %}{{ s4a_video }}
        {% elif active_scenario == '5' %}{{ s5_video }}
        {% elif active_scenario == '6' %}{{ s6_video }}
        {% else %}true{% endif %}
      current_importance: >
        {% if active_scenario == '1' %}{{ s1_importance_check }}
        {% elif active_scenario == '2' %}{{ s2_importance_check }}
        {% elif active_scenario == '3' %}{{ s3_importance_check }}
        {% elif active_scenario == '4' %}{{ s4_importance_check }}
        {% elif active_scenario == '4a' %}{{ s4a_importance_check }}
        {% elif active_scenario == '5' %}{{ s5_importance_check }}
        {% elif active_scenario == '6' %}{{ s6_importance_check }}
        {% else %}false{% endif %}
      current_level_no_person: >
        {% if active_scenario == '1' %}{{ s1_level_no_person }}
        {% elif active_scenario == '2' %}{{ s2_level_no_person }}
        {% elif active_scenario == '3' %}{{ s3_level_no_person }}
        {% elif active_scenario == '4' %}{{ s4_level_no_person }}
        {% elif active_scenario == '4a' %}{{ s4a_level_no_person }}
        {% elif active_scenario == '5' %}{{ s5_level_no_person }}
        {% elif active_scenario == '6' %}{{ s6_level_no_person }}
        {% else %}passive{% endif %}
      current_level_probably_person: >
        {% if active_scenario == '1' %}{{ s1_level_probably_person }}
        {% elif active_scenario == '2' %}{{ s2_level_probably_person }}
        {% elif active_scenario == '3' %}{{ s3_level_probably_person }}
        {% elif active_scenario == '4' %}{{ s4_level_probably_person }}
        {% elif active_scenario == '4a' %}{{ s4a_level_probably_person }}
        {% elif active_scenario == '5' %}{{ s5_level_probably_person }}
        {% elif active_scenario == '6' %}{{ s6_level_probably_person }}
        {% else %}active{% endif %}
      current_level_definitely_person: >
        {% if active_scenario == '1' %}{{ s1_level_definitely_person }}
        {% elif active_scenario == '2' %}{{ s2_level_definitely_person }}
        {% elif active_scenario == '3' %}{{ s3_level_definitely_person }}
        {% elif active_scenario == '4' %}{{ s4_level_definitely_person }}
        {% elif active_scenario == '4a' %}{{ s4a_level_definitely_person }}
        {% elif active_scenario == '5' %}{{ s5_level_definitely_person }}
        {% elif active_scenario == '6' %}{{ s6_level_definitely_person }}
        {% else %}critical{% endif %}
      current_gate_enable: >
        {% if active_scenario == '1' %}{{ s1_gate_enable }}
        {% elif active_scenario == '2' %}{{ s2_gate_enable }}
        {% elif active_scenario == '3' %}{{ s3_gate_enable }}
        {% elif active_scenario == '4' %}{{ s4_gate_enable }}
        {% elif active_scenario == '4a' %}{{ s4a_gate_enable }}
        {% elif active_scenario == '5' %}{{ s5_gate_enable }}
        {% elif active_scenario == '6' %}{{ s6_gate_enable }}
        {% else %}false{% endif %}
      current_gate_threshold: >
        {% if active_scenario == '1' %}{{ s1_gate_threshold }}
        {% elif active_scenario == '2' %}{{ s2_gate_threshold }}
        {% elif active_scenario == '3' %}{{ s3_gate_threshold }}
        {% elif active_scenario == '4' %}{{ s4_gate_threshold }}
        {% elif active_scenario == '4a' %}{{ s4a_gate_threshold }}
        {% elif active_scenario == '5' %}{{ s5_gate_threshold }}
        {% elif active_scenario == '6' %}{{ s6_gate_threshold }}
        {% else %}active{% endif %}
      current_mobile_push: >
        {% if active_scenario == '1' %}{{ s1_mobile_push }}
        {% elif active_scenario == '2' %}{{ s2_mobile_push }}
        {% elif active_scenario == '3' %}{{ s3_mobile_push }}
        {% elif active_scenario == '4' %}{{ s4_mobile_push }}
        {% elif active_scenario == '4a' %}{{ s4a_mobile_push }}
        {% elif active_scenario == '5' %}{{ s5_mobile_push }}
        {% elif active_scenario == '6' %}{{ s6_mobile_push }}
        {% else %}true{% endif %}
      current_video_min_detection: >
        {% if active_scenario == '1' %}{{ s1_video_min_detection }}
        {% elif active_scenario == '2' %}{{ s2_video_min_detection }}
        {% elif active_scenario == '3' %}{{ s3_video_min_detection }}
        {% elif active_scenario == '4' %}{{ s4_video_min_detection }}
        {% elif active_scenario == '4a' %}{{ s4a_video_min_detection }}
        {% elif active_scenario == '5' %}{{ s5_video_min_detection }}
        {% elif active_scenario == '6' %}{{ s6_video_min_detection }}
        {% else %}never{% endif %}
      current_tv_notify: >
        {% if active_scenario == '1' %}{{ s1_tv_notify }}
        {% elif active_scenario == '2' %}{{ s2_tv_notify }}
        {% elif active_scenario == '3' %}{{ s3_tv_notify }}
        {% elif active_scenario == '4' %}{{ s4_tv_notify }}
        {% elif active_scenario == '4a' %}{{ s4a_tv_notify }}
        {% elif active_scenario == '5' %}{{ s5_tv_notify }}
        {% elif active_scenario == '6' %}{{ s6_tv_notify }}
        {% else %}false{% endif %}
      current_tts_enable: >
        {% if active_scenario == '1' %}{{ s1_tts_enable }}
        {% elif active_scenario == '2' %}{{ s2_tts_enable }}
        {% elif active_scenario == '3' %}{{ s3_tts_enable }}
        {% elif active_scenario == '4' %}{{ s4_tts_enable }}
        {% elif active_scenario == '4a' %}{{ s4a_tts_enable }}
        {% elif active_scenario == '5' %}{{ s5_tts_enable }}
        {% elif active_scenario == '6' %}{{ s6_tts_enable }}
        {% else %}false{% endif %}
      current_alarm_mode: >
        {% if active_scenario == '1' %}{{ s1_alarm_mode }}
        {% elif active_scenario == '2' %}{{ s2_alarm_mode }}
        {% elif active_scenario == '3' %}{{ s3_alarm_mode }}
        {% elif active_scenario == '4' %}{{ s4_alarm_mode }}
        {% elif active_scenario == '4a' %}{{ s4a_alarm_mode }}
        {% elif active_scenario == '5' %}{{ s5_alarm_mode }}
        {% elif active_scenario == '6' %}{{ s6_alarm_mode }}
        {% else %}false{% endif %}
      current_alarm_conditions: >
        {% if active_scenario == '4' %}{{ s4_alarm_conditions | default([]) }}
        {% elif active_scenario == '4a' %}{{ s4a_alarm_conditions | default([]) }}
        {% else %}[]{% endif %}
  
  # 1) Create snapshot and/or video
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (current_snapshot | bool) and (current_video | bool) and camera_entity_snapshot != '' }}"
        sequence:
          - parallel:
              - action: camera.snapshot
                continue_on_error: true
                target:
                  entity_id: "{{ camera_entity_snapshot }}"
                data:
                  filename: "{{ file_path }}"
              - action: camera.record
                continue_on_error: true
                target:
                  entity_id: "{{ camera_entity_snapshot }}"
                data:
                  filename: "{{ video_file_path }}"
                  duration: "{{ video_duration }}"
                  lookback: "{{ video_lookback }}"
      - conditions:
          - condition: template
            value_template: "{{ (current_snapshot | bool) and not (current_video | bool) and camera_entity_snapshot != '' }}"
        sequence:
          - action: camera.snapshot
            continue_on_error: true
            target:
              entity_id: "{{ camera_entity_snapshot }}"
            data:
              filename: "{{ file_path }}"
      - conditions:
          - condition: template
            value_template: "{{ not (current_snapshot | bool) and (current_video | bool) and camera_entity_snapshot != '' }}"
        sequence:
          - action: camera.record
            continue_on_error: true
            target:
              entity_id: "{{ camera_entity_snapshot }}"
            data:
              filename: "{{ video_file_path }}"
              duration: "{{ video_duration }}"
              lookback: "{{ video_lookback }}"

  # 1b) Snapshot-Status und gemeinsame Push-Daten (4.3.0)
  # continue_on_error liefert kein Fehlersignal. snapshot_created ist daher eine Best-Effort-Annahme:
  # Snapshot im Szenario aktiv UND Kamera beim Aufruf weder unavailable noch unknown.
  # push_data_base wird von Step 4 und Step 8 genutzt (Actions nur einmal gebaut, Attachment nur mit Snapshot).
  - variables:
      snapshot_created: >
        {{ (current_snapshot | bool) and camera_entity_snapshot != ''
           and states(camera_entity_snapshot) not in ['unavailable', 'unknown'] }}
      push_data_base: >
        {% set d = {'url': tap_navigate, 'clickAction': tap_navigate, 'tag': notification_tag,
                    'group': 'cams', 'actions': notification_actions} %}
        {% if snapshot_created | bool %}
          {% set d = d | combine({'attachment': {'url': snapshot_access_file_path, 'content_type': 'JPEG'}}) %}
        {% endif %}
        {{ d }}

  # 2) Importance analysis (with Structured Output)
  # Läuft nur mit Snapshot (4.3.0). Snapshot im Szenario aus -> disabled.
  # Snapshot an, aber Kamera nicht verfügbar -> no_response (Fallback probably-person, kein API-Aufruf).
  - variables:
      importance_status: >
        {% if not (current_importance | bool) or not (current_snapshot | bool) %}disabled
        {% elif not (snapshot_created | bool) %}no_response
        {% else %}pending{% endif %}
      importance_attempts_used: 0
      _importance_result_temp: ""
      _importance_title_temp: ""

  - if:
      - condition: template
        value_template: "{{ importance_status == 'pending' }}"
    then:
      - repeat:
          while:
            - condition: template
              value_template: >
                {% set valid = ['no-person', 'probably-person', 'definitely-person'] %}
                {% set r = _importance_result_temp | lower %}
                {% set ok = valid | select('in', r) | list | length > 0 %}
                {{ not ok and repeat.index <= importance_max_retries }}
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.index > 1 }}"
              then:
                - delay: !input importance_retry_delay
            # Reset, damit ein fehlgeschlagener Aufruf (Exception) nicht mit einer alten Antwort weiterläuft
            - variables:
                _importance_response: {}
            - action: llmvision.image_analyzer
              continue_on_error: true
              data:
                image_file: "{{ file_path }}"
                provider: !input provider
                model: !input model
                message: >
                  Current time: {{ now().strftime('%H:%M') }}

                  {% if repeat.index > 1 %}IMPORTANT: You MUST respond with a valid JSON classification. Choose exactly one: no-person, probably-person, or definitely-person.

                  {% endif %}{{ importance_prompt }}
                include_filename: true
                target_width: "{{ importance_target_width }}"
                max_tokens: "{{ importance_max_tokens }}"
                generate_title: true
                store_in_timeline: false
                response_format: json
                structure: "{{ detection_structure }}"
              response_variable: _importance_response
            - variables:
                _importance_result_temp: >
                  {% set sr = (_importance_response | default({})).structured_response | default(none) %}
                  {% if sr is mapping and sr.classification is defined %}
                    {{ sr.classification }}
                  {% else %}
                    {% set raw = ((_importance_response | default({})).response_text | default('')) | trim %}
                    {% if raw and (raw.startswith('{') or raw.startswith('[')) %}
                      {% set parsed = raw | from_json %}
                      {% if parsed is mapping and parsed.classification is defined %}
                        {{ parsed.classification }}
                      {% else %}
                        {{ raw }}
                      {% endif %}
                    {% else %}
                      {{ raw }}
                    {% endif %}
                  {% endif %}
                _importance_title_temp: "{{ (_importance_response | default({})).title | default('') }}"
                importance_attempts_used: "{{ repeat.index }}"
      - variables:
          importance_status: >
            {% if _importance_result_temp == '' %}no_response
            {% elif 'definitely-person' in (_importance_result_temp | lower) %}success
            {% elif 'probably-person' in (_importance_result_temp | lower) %}success
            {% elif 'no-person' in (_importance_result_temp | lower) %}success
            {% else %}invalid_response{% endif %}

  # 2b) Detection level
  - variables:
      detection_level: >
        {% if importance_status == 'disabled' %}none
        {% elif importance_status in ['no_response', 'invalid_response'] %}probably-person
        {% else %}
          {% set t = _importance_result_temp | lower %}
          {% if 'definitely-person' in t %}definitely-person
          {% elif 'probably-person' in t %}probably-person
          {% elif 'no-person' in t %}no-person
          {% else %}probably-person{% endif %}
        {% endif %}
      initial_interruption_level: >
        {% if detection_level == 'definitely-person' %}{{ current_level_definitely_person }}
        {% elif detection_level == 'probably-person' %}{{ current_level_probably_person }}
        {% else %}{{ current_level_no_person }}{% endif %}

  # Initialize variables for debugging to avoid crashes in Step 4
  - variables:
      verified_detection: "{{ detection_level }}"
      final_interruption_level: "{{ initial_interruption_level }}"
      video_attempts_used: 0

  # 3) Gate check
  - if:
      - condition: template
        value_template: "{{ current_gate_enable | bool }}"
      - condition: template
        value_template: "{{ (level_rank[initial_interruption_level]|default(0)) < (level_rank[current_gate_threshold]|default(0)) }}"
    then:
      - stop: "Gate: Level {{ initial_interruption_level }} < Threshold {{ current_gate_threshold }}"

  # 4) Mobile push notification
  - if:
      - condition: template
        value_template: "{{ current_mobile_push | bool }}"
    then:
      - repeat:
          for_each: "{{ notify_services_all }}"
          sequence:
            - action: "notify.{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ camera }} - {{ label }} um {{ now().strftime('%H:%M') }}"
                message: >
                  {% if importance_status == 'disabled' %}Bewegung erkannt
                  {% elif importance_status == 'no_response' %}Bewegung erkannt - Analyse nicht möglich
                  {% elif importance_status == 'invalid_response' %}Bewegung erkannt - Analyse fehlerhaft
                  {% elif detection_level == 'definitely-person' %}Person erkannt
                  {% elif detection_level == 'probably-person' %}Möglicherweise Person erkannt
                  {% else %}Bewegung erkannt - keine Person{% endif %}{% if debug_info_enabled | bool %}

                  (S{{ active_scenario }} | {{ debug_camera_info }} | cd:{{ cooldown.detail }} | {% if importance_status == 'disabled' %}skip{% else %}img{% endif %}:{{ detection_level }} | {{ initial_interruption_level }}){% endif %}
                data: >
                  {% set crit = initial_interruption_level == 'critical' %}
                  {{ push_data_base | combine({'push': {
                       'interruption-level': initial_interruption_level,
                       'sound': {
                         'name': notification_sound_critical if crit else notification_sound,
                         'volume': notification_volume_critical if crit else notification_volume,
                         'critical': crit}}}) }}

  # 5) Video analysis with Structured Output and store_in_timeline
  # detection_level 'none' (Wichtigkeitsanalyse aus) hat Rang 0: Schwellen probably-/definitely-person
  # gelten dann als NICHT erreicht (4.3.0, vorher Template-Fehler). Gleiches gilt für TV/Other-Notify.
  - variables:
      video_should_run: >
        {% if not (current_video | bool) %}false
        {% elif current_video_min_detection == 'always' %}true
        {% elif current_video_min_detection == 'never' %}false
        {% elif current_video_min_detection == 'no-person' %}true
        {% elif current_video_min_detection == 'probably-person' and detection_rank.get(detection_level, 0) >= 1 %}true
        {% elif current_video_min_detection == 'definitely-person' and detection_rank.get(detection_level, 0) >= 2 %}true
        {% else %}false{% endif %}
      video_status: "{% if video_should_run | bool %}pending{% else %}disabled{% endif %}"
      video_result: ""
      _video_title_temp: ""

  - if:
      - condition: template
        value_template: "{{ (video_should_run | bool) and camera_entity_snapshot != '' }}"
    then:
      - variables:
          _video_result_temp: "probably-person"

      # Explicit Type Casting for Integers
      - delay: 
          seconds: "{{ video_duration | int + video_lookback | int + 2 }}"

      - repeat:
          while:
            - condition: template
              value_template: "{{ _video_result_temp == 'probably-person' and repeat.index <= video_max_retries }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.index > 1 }}"
              then:
                - delay: !input video_retry_delay
            - action: llmvision.video_analyzer
              continue_on_error: true
              data:
                video_file: "{{ video_file_path }}"
                provider: !input provider
                model: !input model
                message: >
                  Current time: {{ now().strftime('%H:%M') }}

                  {% if repeat.index > 1 %}IMPORTANT: Avoid "probably-person". Make your best assessment between "definitely-person" and "no-person".

                  {% endif %}{{ video_prompt }}
                include_filename: true
                max_frames: "{{ video_max_frames }}"
                target_width: "{{ video_target_width }}"
                max_tokens: "{{ video_max_tokens }}"
                generate_title: "{{ store_in_timeline | bool }}"
                store_in_timeline: false
                expose_images: "{{ store_in_timeline | bool }}"
                response_format: json
                structure: "{{ detection_structure }}"
              response_variable: _response
            - variables:
                _video_result_temp: >
                  {% set sr = ((_response | default({})).structured_response | default(none)) %}
                  {% if sr is mapping and sr.classification is defined %}
                    {{ sr.classification }}
                  {% else %}
                    {% set raw = ((_response | default({})).response_text | default('')) | trim %}
                    {% if raw and (raw.startswith('{') or raw.startswith('[')) %}
                      {% set parsed = raw | from_json %}
                      {% if parsed is mapping and parsed.classification is defined %}
                        {{ parsed.classification }}
                      {% else %}
                        {{ raw }}
                      {% endif %}
                    {% else %}
                      {{ raw }}
                    {% endif %}
                  {% endif %}
                _video_title_temp: "{{ (_response | default({})).title | default('') }}"
                video_attempts_used: "{{ repeat.index }}"
      - variables:
          video_status: >
            {% if _video_result_temp == '' %}no_response
            {% elif _video_result_temp == 'probably-person' %}still_unclear
            {% else %}success{% endif %}
          video_result: "{{ _video_result_temp }}"
          verified_detection: >
            {% if _video_result_temp == 'definitely-person' %}definitely-person
            {% elif _video_result_temp == 'no-person' %}no-person
            {% else %}probably-person{% endif %}
          final_interruption_level: >
            {% if verified_detection == 'definitely-person' %}{{ current_level_definitely_person }}
            {% elif verified_detection == 'probably-person' %}{{ current_level_probably_person }}
            {% else %}{{ current_level_no_person }}{% endif %}

  # 5b) store_in_timeline: Create timeline event after analysis is complete
  - if:
      - condition: template
        value_template: "{{ store_in_timeline | bool }}"
    then:
      - action: llmvision.create_event
        continue_on_error: true
        data:
          title: >
            {% if _video_title_temp | default('') %}
              {{ _video_title_temp }}
            {% elif _importance_title_temp | default('') %}
              {{ _importance_title_temp }}
            {% else %}
              Kamera Event
            {% endif %}
          description: >
            {% if video_status | default('disabled') == 'success' and video_result | default('') %}
              {{ video_result_map[video_result] | default(video_result) }}
            {% elif detection_level | default('') %}
              {{ video_result_map[detection_level] | default(detection_level) }}
            {% else %}
              Keine Analyse Ergebnisse
            {% endif %}
          camera_entity: "{{ camera_entity_snapshot }}"
          label: >
            {% if verified_detection in ['definitely-person', 'probably-person'] %}Person
            {% else %}Camera{% endif %}

  # 6) TV notifications - LG WebOS TV
  - variables:
      lg_tv_should_send: >
        {% if not (current_tv_notify | bool) or not (lg_tv_enable | bool) or lg_tv_notify_services | length == 0 %}false
        {% elif lg_tv_min_detection == 'always' %}true
        {% elif lg_tv_min_detection == 'never' %}false
        {% elif lg_tv_min_detection == 'no-person' %}true
        {% elif lg_tv_min_detection == 'probably-person' and detection_rank.get(verified_detection, 0) >= 1 %}true
        {% elif lg_tv_min_detection == 'definitely-person' and detection_rank.get(verified_detection, 0) >= 2 %}true
        {% else %}false{% endif %}

  - if:
      - condition: template
        value_template: "{{ lg_tv_should_send | bool }}"
      - condition: and
        conditions: !input lg_tv_conditions
    then:
      - repeat:
          count: >
            {{ lg_tv_repeat_count if ((current_alarm_mode | bool) and (level_rank[final_interruption_level]|default(0) >= 2)) else 1 }}
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.index > 1 }}"
              then:
                - delay: !input lg_tv_repeat_delay
            - repeat:
                for_each: "{{ lg_tv_notify_services }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: "{{ lg_tv_message_title }}"
                      message: >
                        {% if video_status == 'success' and video_result %}
                          {{ camera_friendly }}: {{ video_result_map[video_result] | default(video_result) }}
                        {% elif verified_detection == 'definitely-person' %}{{ camera_friendly }}: Person erkannt
                        {% elif verified_detection == 'probably-person' %}{{ camera_friendly }}: Möglicherweise Person
                        {% else %}{{ camera_friendly }}: Bewegung erkannt{% endif %}

  # 6b) TV notifications - Other Notify Services
  - variables:
      other_notify_should_send: >
        {% if not (current_tv_notify | bool) or other_notify_entities|length == 0 %}false
        {% elif other_notify_min_detection == 'always' %}true
        {% elif other_notify_min_detection == 'never' %}false
        {% elif other_notify_min_detection == 'no-person' %}true
        {% elif other_notify_min_detection == 'probably-person' and detection_rank.get(verified_detection, 0) >= 1 %}true
        {% elif other_notify_min_detection == 'definitely-person' and detection_rank.get(verified_detection, 0) >= 2 %}true
        {% else %}false{% endif %}

  - if:
      - condition: template
        value_template: "{{ other_notify_should_send | bool }}"
      - condition: and
        conditions: !input other_notify_conditions
    then:
      - repeat:
          count: >
            {{ other_notify_repeat_count if ((current_alarm_mode | bool) and (level_rank[final_interruption_level]|default(0) >= 2)) else 1 }}
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.index > 1 }}"
              then:
                - delay: !input other_notify_repeat_delay
            - repeat:
                for_each: "{{ other_notify_entities }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: "{{ other_notify_title }}"
                      message: >
                        {% if video_status == 'success' and video_result %}
                          {{ camera_friendly }}: {{ video_result_map[video_result] | default(video_result) }}
                        {% elif verified_detection == 'definitely-person' %}{{ camera_friendly }}: Person erkannt
                        {% elif verified_detection == 'probably-person' %}{{ camera_friendly }}: Möglicherweise Person
                        {% else %}{{ camera_friendly }}: Bewegung erkannt{% endif %}

  # 7) TTS announcement
  - if:
      - condition: template
        value_template: "{{ current_tts_enable | bool }}"
      - condition: template
        value_template: "{{ final_interruption_level == 'critical' }}"
      - condition: template
        value_template: "{{ tts_media_players|length > 0 }}"
      - condition: template
        value_template: "{{ tts_target_entity != none and tts_target_entity|length > 0 }}"
    then:
      - repeat:
          count: "{{ tts_repeat_count }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.index > 1 }}"
              then:
                - delay: !input tts_repeat_delay
            - repeat:
                for_each: "{{ tts_media_players }}"
                sequence:
                  - action: media_player.volume_set
                    continue_on_error: true
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      volume_level: "{{ tts_volume }}"
                  - action: tts.speak
                    continue_on_error: true
                    target:
                      entity_id: "{{ tts_target_entity }}"
                    data:
                      cache: false
                      media_player_entity_id: "{{ repeat.item }}"
                      message: >
                        {% if video_status == 'success' and video_result %}
                          Achtung! {{ camera_friendly }}: {{ video_result_map[video_result] | default(video_result) }}
                        {% elif verified_detection == 'definitely-person' %}Achtung! {{ camera_friendly }}: Person erkannt
                        {% elif verified_detection == 'probably-person' %}Achtung! {{ camera_friendly }}: Möglicherweise Person
                        {% else %}Achtung! {{ camera_friendly }} meldet kritisches Ereignis{% endif %}

  # 8) Update push
  - if:
      - condition: template
        value_template: "{{ video_status != 'disabled' }}"
    then:
      # Loop Logic: Repeat count > 1 ONLY if level is time-sensitive or higher AND alarm mode is ON
      - repeat:
          count: >
            {{ alarm_repetition_count if ((current_alarm_mode | bool) and (level_rank[final_interruption_level]|default(0) >= 2)) else 1 }}
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.index > 1 }}"
              then:
                - delay: !input alarm_repetition_delay
            - repeat:
                for_each: "{{ notify_services_all }}"
                sequence:
                  - action: "notify.{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: "{{ camera }} - Update um {{ now().strftime('%H:%M') }}"
                      message: >
                        {% if video_status == 'no_response' %}Video-Analyse nicht möglich
                        {% elif video_status == 'still_unclear' %}Video-Analyse blieb unklar
                        {% elif video_result %}{% if verified_detection != detection_level %}VERIFIZIERT: {{ video_result_map[video_result] | default(video_result) }}
                        {% else %}{{ video_result_map[video_result] | default(video_result) }}{% endif %}
                        {% else %}{{ video_result_map[verified_detection] | default('Bewegung erkannt') }}{% endif %}{% if debug_info_enabled | bool %}

                        (S{{ active_scenario }} | {{ debug_camera_info }} | cd:{{ cooldown.detail }} | img:{{ detection_level }} → {{ 'vid' if video_status == 'success' else 'img' }}:{{ verified_detection }} | {{ final_interruption_level }} | {{ video_attempts_used }}x){% endif %}
                      data: >
                        {% set crit = final_interruption_level == 'critical' %}
                        {{ push_data_base | combine({'push': {
                             'interruption-level': final_interruption_level,
                             'sound': {
                               'name': notification_sound_critical if crit else notification_sound,
                               'volume': notification_volume_critical if crit else notification_volume,
                               'critical': crit}}}) }}

blueprint:
  name: "Camera Event Notification 3.8.1"
  author: "MF"
  homeassistant:
    min_version: 2024.10.0
  description: >
    Szenario-basierte Kamera-Überwachung mit intelligenter Personen-Erkennung. 
    Features: 3-stufige Wichtigkeitsanalyse, Video-Verifikation, dynamische Level-Anpassung.
    
    VERSION 3.8.0:
    - NEU: Integration von llmvision.remember als Abschluss-Aktion.
    - NEU: Automatische Titel-Generierung (generate_title).
    - CODE: YAML-Anchors genutzt, um Redundanz in den Input-Descriptions zu reduzieren.
    - UPDATE: Remember-Aktion nutzt Web-Pfad und erfolgt vor dem Abschluss-Delay.

  domain: automation
  source_url: https://github.com/michaelf988/ha-cam-snapshot/blob/main/ha-cam-snapshot-new.yaml

  input:
    # =======================
    # 0. DEBUGGING
    # =======================
    debug_info_enabled:
      name: "🐞 Debug-Infos in Nachrichten anzeigen"
      description: "Fügt technische Details (Szenario, Level, API-Versuche) an das Ende der Push-Nachricht an."
      default: false
      selector:
        boolean: {}

    # =======================
    # 1. KAMERAS & SENSOREN
    # =======================
    cameras_section:
      name: "Kameras & Sensoren"
      description: "Konfiguration der Auslöser."
      icon: mdi:camera
      collapsed: true
      input:
        camera_entities:
          name: "Kamera Entitäten"
          description: "Wähle eine oder mehrere Kameras aus, von denen Bilder/Videos stammen sollen."
          selector:
            entity:
              multiple: true
              filter:
                domain: camera

        trigger_state:
          name: "Trigger Status"
          description: "Startet, wenn die Kamera in diesen Zustand wechselt (z.B. 'recording')."
          default: "recording"
          selector:
            text:

        motion_sensors:
          name: "Bewegungsmelder (optional)"
          description: "Alternativer Auslöser. Muss exakt der Reihenfolge der Kameras entsprechen."
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: binary_sensor

    # =======================
    # 2. SPEICHERUNG
    # =======================
    storage_section:
      name: "Speicherung"
      description: "Dateipfade und Namensgebung."
      icon: mdi:folder
      collapsed: true
      input:
        timestamp_filenames:
          name: "Zeitstempel in Dateinamen nutzen"
          default: true
          selector:
            boolean:
            
        timestamp_format:
          name: "Zeitstempel-Format"
          default: "%Y-%m-%d_%H-%M-%S"
          selector:
            text:

        snapshot_dir_fs:
          name: "Basis-Pfad (Dateisystem)"
          default: "/config/www/snapshots"
          selector:
            text:
            
        snapshot_dir_web:
          name: "Basis-Pfad (Web)"
          default: "/local/snapshots"
          selector:
            text:

    # =======================
    # 3. AI GRUNDEINSTELLUNGEN
    # =======================
    ai_base_section:
      name: "AI Grundeinstellungen"
      description: "Verbindung zum LLM Vision Provider."
      icon: mdi:brain
      collapsed: true
      input:
        provider:
          name: "AI Provider"
          selector:
            config_entry:
              integration: llmvision

        model:
          name: "AI Model"
          default: "gpt-4o-mini"
          selector:
            text:

    # =======================
    # 3a. VIDEO-AUFNAHME EINSTELLUNGEN
    # =======================
    video_recording_section:
      name: "Video-Aufnahme Einstellungen"
      icon: mdi:video
      collapsed: true
      input:
        video_duration:
          name: "Video-Dauer (Sekunden)"
          default: 5
          selector:
            number:
              min: 1
              max: 30
              unit_of_measurement: seconds

        video_lookback:
          name: "Video-Rückblick (Sekunden)"
          default: 5
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: seconds

    # =======================
    # 3b. WICHTIGKEITS-ANALYSE
    # =======================
    importance_analysis_section:
      name: "Wichtigkeits-Analyse (Snapshot)"
      icon: mdi:image-search
      collapsed: true
      input:
        importance_target_width:
          name: "Bild-Breite (Pixel)"
          default: 1280
          selector:
            number:
              min: 512
              max: 3840

        importance_max_tokens:
          name: "Max Tokens"
          default: 4000
          selector:
            number:
              min: 1
              max: 15000

        importance_max_retries:
          name: "Max Versuche"
          default: 2
          selector:
            number:
              min: 1
              max: 10

        importance_retry_delay:
          name: "Pause zwischen Versuchen"
          default: { seconds: 1 }
          selector:
            duration: {}

        importance_prompt:
          name: "Wichtigkeits-Analyse Prompt"
          default: >
            CONTEXT: Security camera snapshot from a private property surveillance system.
            Current time: {{ now().strftime('%H:%M') }}
            
            TASK: Analyze this single frame for human presence.
            
            CLASSIFICATION (return ONLY one of these labels):
            - "no-person" = No human detected, no security concern
            - "probably-person" = Unclear, possibly a person, shadows or partial view
            - "definitely-person" = Clear human presence detected
            
            Consider: Body shape, movement patterns typical of humans, size relative to environment.
            Ignore: Pets, vehicles (unless person visible inside), shadows without clear human form.
            
            RESPONSE: One label only.
          selector:
            text:
              multiline: true

    # =======================
    # 3c. VIDEO-ANALYSE
    # =======================
    video_analysis_section:
      name: "Video-Analyse (Verifikation)"
      icon: mdi:video-check
      collapsed: true
      input:
        video_target_width:
          name: "Bild-Breite (Pixel)"
          default: 1280
          selector:
            number:
              min: 512
              max: 3840

        video_max_frames:
          name: "Max Frames"
          default: 3
          selector:
            number:
              min: 1
              max: 10

        video_max_tokens:
          name: "Max Tokens"
          default: 5000
          selector:
            number:
              min: 1
              max: 15000

        video_max_retries:
          name: "Max Versuche"
          default: 3
          selector:
            number:
              min: 1
              max: 10

        video_retry_delay:
          name: "Pause zwischen Versuchen"
          default: { seconds: 2 }
          selector:
            duration: {}

        video_prompt:
          name: "Video-Analyse Prompt"
          default: >
            CONTEXT: Security camera video recording from private property.
            Current time: {{ now().strftime('%H:%M') }}
            
            TASK: Analyze the video sequence for HUMAN presence.
            
            RESPONSE OPTIONS (choose EXACTLY one):
            - "definitely-person" = Clear human presence (single or multiple)
            - "probably-person" = Unclear, possibly a person, bad lighting
            - "no-person" = No human visible (includes pets, vehicles, wind, no motion)
            
            INSTRUCTIONS:
            - If you see a vehicle BUT NO PERSON inside/outside: choose "no-person".
            - If you see an animal BUT NO PERSON: choose "no-person".
            - Only choose "definitely-person" if you are sure it is a human.
            
            RESPONSE: One label only from the list above.
          selector:
            text:
              multiline: true

    # =======================
    # 4. TTS GRUNDEINSTELLUNGEN
    # =======================
    tts_base_section:
      name: "Text-to-Speech Grundeinstellungen"
      icon: mdi:volume-high
      collapsed: true
      input:
        tts_target_entity:
          name: "TTS Service"
          selector:
            entity:
              filter:
                domain: tts

        tts_media_players:
          name: "Lautsprecher für TTS"
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: media_player

        tts_volume:
          name: "TTS Lautstärke"
          default: 0.7
          selector:
            number:
              min: 0
              max: 1
              step: 0.05

        tts_repeat_count:
          name: "TTS Wiederholungen"
          default: 3
          selector:
            number:
              min: 1
              max: 10

        tts_repeat_delay:
          name: "Pause zwischen Wiederholungen"
          default: { seconds: 2 }
          selector:
            duration: {}

    # =======================
    # 5. MOBILE BENACHRICHTIGUNGEN
    # =======================
    mobile_notifications_section:
      name: "Mobile Benachrichtigungen"
      icon: mdi:cellphone
      collapsed: true
      input:
        notify_device:
          name: "Mobile Geräte"
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app

        tap_navigate:
          name: "Tap / Click Action Path"
          default: "/lovelace/cameras"
          selector:
            text:

        delay_notification:
          name: "Cooldown zwischen Benachrichtigungen"
          default: 15
          selector:
            number:
              min: 0
              max: 600
              unit_of_measurement: seconds

        alarm_repetition_count:
          name: "Alarm-Wiederholungen (Anzahl)"
          default: 5
          selector:
            number:
              min: 1
              max: 20

        alarm_repetition_delay:
          name: "Pause zwischen Alarm-Wiederholungen"
          default: { seconds: 3 }
          selector:
            duration: {}

    # =======================
    # 5a. BENACHRICHTIGUNGSTÖNE
    # =======================
    notification_sounds_section:
      name: "Benachrichtigungstöne"
      icon: mdi:bell-ring
      collapsed: true
      input:
        notification_sound:
          name: "Ton (Normal)"
          default: "LiquidDetected.caf"
          selector:
            text:

        notification_volume:
          name: "Lautstärke (Normal)"
          default: 0.7
          selector:
            number:
              min: 0
              max: 1
              step: 0.1

        notification_sound_critical:
          name: "Ton (Critical)"
          default: "alarm.caf"
          selector:
            text:

        notification_volume_critical:
          name: "Lautstärke (Critical)"
          default: 1.0
          selector:
            number:
              min: 0
              max: 1
              step: 0.1

    # =======================
    # 5b. ACTION BUTTONS
    # =======================
    action_buttons_section:
      name: "Action Buttons"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        action1_enabled:
          name: "Button 1 aktivieren"
          default: true
          selector:
            boolean:
        action1_title:
          name: "Button 1 Text"
          default: "Öffnen"
          selector:
            text:
        action1_uri:
          name: "Button 1 URI (optional)"
          default: ""
          selector:
            text:
        action1_icon:
          name: "Button 1 Icon (optional)"
          default: ""
          selector:
            text:
        action1_destructive:
          name: "Button 1 Rot markieren"
          default: false
          selector:
            boolean:

        action2_enabled:
          name: "Button 2 aktivieren"
          default: true
          selector:
            boolean:
        action2_title:
          name: "Button 2 Text"
          default: "Snooze 15min"
          selector:
            text:
        action2_uri:
          name: "Button 2 URI (optional)"
          default: ""
          selector:
            text:
        action2_icon:
          name: "Button 2 Icon (optional)"
          default: ""
          selector:
            text:
        action2_destructive:
          name: "Button 2 Rot markieren"
          default: false
          selector:
            boolean:

        action3_enabled:
          name: "Button 3 aktivieren"
          default: false
          selector:
            boolean:
        action3_title:
          name: "Button 3 Text"
          default: "Alarm aus"
          selector:
            text:
        action3_uri:
          name: "Button 3 URI (optional)"
          default: ""
          selector:
            text:
        action3_icon:
          name: "Button 3 Icon (optional)"
          default: ""
          selector:
            text:
        action3_destructive:
          name: "Button 3 Rot markieren"
          default: true
          selector:
            boolean:

    # =======================
    # 6. TV & WEITERE GERÄTE
    # =======================
    additional_notifications_section:
      name: "TV & weitere Benachrichtigungen"
      icon: mdi:television
      collapsed: true
      input:
        lg_tv_enable:
          name: "LG WebOS TV Benachrichtigungen"
          default: false
          selector:
            boolean:

        lg_tv_entities:
          name: "LG WebOS TV Geräte"
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: media_player
                integration: webostv

        lg_tv_conditions:
          name: "Bedingungen für LG TV-Benachrichtigungen"
          default: []
          selector:
            condition:

        lg_tv_message_title:
          name: "LG TV Nachricht Titel"
          default: "Sicherheitswarnung"
          selector:
            text:

        lg_tv_min_detection:
          name: "LG TV ab Detection-Level"
          default: "no-person"
          selector:
            select:
              options:
                - label: "Immer"
                  value: "always"
                - label: "Ab: Keine Person"
                  value: "no-person"
                - label: "Ab: Wahrscheinlich Person"
                  value: "probably-person"
                - label: "Ab: Definitiv Person"
                  value: "definitely-person"
                - label: "Nie"
                  value: "never"

        lg_tv_repeat_count:
          name: "LG TV Wiederholungen"
          default: 3
          selector:
            number:
              min: 1
              max: 20

        lg_tv_repeat_delay:
          name: "LG TV Pause zwischen Wiederholungen"
          default: { seconds: 3 }
          selector:
            duration: {}

        other_notify_entities:
          name: "Weitere Notify Services (optional)"
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: notify

        other_notify_conditions:
          name: "Bedingungen für weitere Benachrichtigungen"
          default: []
          selector:
            condition:

        other_notify_title:
          name: "Weitere Services - Titel"
          default: "Sicherheitswarnung"
          selector:
            text:

        other_notify_min_detection:
          name: "Weitere Services ab Detection-Level"
          default: "no-person"
          selector:
            select:
              options:
                - label: "Immer"
                  value: "always"
                - label: "Ab: Keine Person"
                  value: "no-person"
                - label: "Ab: Wahrscheinlich Person"
                  value: "probably-person"
                - label: "Ab: Definitiv Person"
                  value: "definitely-person"
                - label: "Nie"
                  value: "never"

        other_notify_repeat_count:
          name: "Weitere Services Wiederholungen"
          default: 3
          selector:
            number:
              min: 1
              max: 20

        other_notify_repeat_delay:
          name: "Weitere Services Pause zwischen Wiederholungen"
          default: { seconds: 3 }
          selector:
            duration: {}

    # =======================
    # 7. SZENARIO-STEUERUNG
    # =======================
    scenario_control_section:
      name: "Szenario-Steuerung"
      icon: mdi:home-automation
      collapsed: false
      input:
        scenario_helper:
          name: "Szenario 6 Helper Entity (Override)"
          description: "Ein Input Boolean. Wenn dieser 'AN' ist, wird SOFORT Szenario 6 erzwungen."
          default: "input_boolean.cam_event_notify_helper"
          selector:
            entity:
              filter:
                domain: input_boolean

        scenario_fallback:
          name: "Fallback Szenario"
          default: "3"
          selector:
            select:
              options:
                - label: "Szenario 1"
                  value: "1"
                - label: "Szenario 2"
                  value: "2"
                - label: "Szenario 3 (Minimal)"
                  value: "3"
                - label: "Szenario 4"
                  value: "4"
                - label: "Szenario 4a"
                  value: "4a"
                - label: "Szenario 5"
                  value: "5"
                - label: "Szenario 6"
                  value: "6"

    # =======================
    # SZENARIO 1 (Definition der Anchor)
    # =======================
    scenario_1_section:
      name: "Szenario 1: Anwesend, Alarmanlage intern scharf"
      icon: mdi:shield-home
      collapsed: true
      input:
        s1_conditions:
          name: "Aktivierungsbedingungen"
          description: &desc_conditions "Definiere hier, wann dieses Szenario aktiv sein soll."
          default: []
          selector:
            condition:

        s1_snapshot:
          name: "Snapshot erstellen"
          default: true
          selector:
            boolean:

        s1_video:
          name: "Video aufnehmen"
          default: true
          selector:
            boolean:

        s1_importance_check:
          name: "Wichtigkeitsanalyse (AI)"
          description: &desc_importance "Aktiviert die erste AI-Prüfung des Snapshots."
          default: true
          selector:
            boolean:

        s1_level_no_person:
          name: "Level bei: Keine Person"
          description: &desc_level_none "Dringlichkeit der Benachrichtigung, wenn AI KEINE Person findet."
          default: "active"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s1_level_probably_person:
          name: "Level bei: Wahrscheinlich Person"
          description: &desc_level_prob "Dringlichkeit, wenn AI sich unsicher ist."
          default: "time-sensitive"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s1_level_definitely_person:
          name: "Level bei: Definitiv Person"
          description: &desc_level_def "Dringlichkeit bei eindeutiger Personenerkennung."
          default: "critical"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s1_gate_enable:
          name: "Gate aktivieren (Filter)"
          description: &desc_gate_enable "Wenn aktiv, werden Nachrichten unterhalb des Schwellwerts KOMPLETT unterdrückt."
          default: true
          selector:
            boolean:

        s1_gate_threshold:
          name: "Gate Schwellwert"
          description: &desc_gate_thresh "Alles unter diesem Level wird ignoriert, wenn Gate aktiv ist."
          default: "passive"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s1_mobile_push:
          name: "Mobile Push senden"
          default: true
          selector:
            boolean:

        s1_video_min_detection:
          name: "Video-Analyse ab Detection-Level"
          description: &desc_video_min "Startet die teure Video-Analyse erst ab einem bestimmten Verdacht im Snapshot."
          default: "probably-person"
          selector:
            select:
              options:
                - label: "Immer"
                  value: "always"
                - label: "Ab: Keine Person"
                  value: "no-person"
                - label: "Ab: Wahrscheinlich Person"
                  value: "probably-person"
                - label: "Ab: Definitiv Person"
                  value: "definitely-person"
                - label: "Nie"
                  value: "never"

        s1_tv_notify:
          name: "TV Benachrichtigung"
          default: false
          selector:
            boolean:

        s1_tts_enable:
          name: "Sprachansage (nur bei Critical)"
          description: &desc_tts "Lautsprecheransage, aber nur wenn das Level 'critical' erreicht wird."
          default: true
          selector:
            boolean:

        s1_alarm_mode:
          name: "Alarm-Wiederholungen aktivieren"
          description: &desc_alarm_mode "Sendet mehrere Push-Nachrichten hintereinander. Greift nur, wenn Level >= time-sensitive."
          default: true
          selector:
            boolean:

    # =======================
    # SZENARIO 2
    # =======================
    scenario_2_section:
      name: "Szenario 2: Anwesend, spät abends, unscharf"
      icon: mdi:weather-night
      collapsed: true
      input:
        s2_conditions:
          name: "Aktivierungsbedingungen"
          description: *desc_conditions
          default: []
          selector:
            condition:

        s2_snapshot:
          name: "Snapshot erstellen"
          default: true
          selector:
            boolean:

        s2_video:
          name: "Video aufnehmen"
          default: true
          selector:
            boolean:

        s2_importance_check:
          name: "Wichtigkeitsanalyse (AI)"
          description: *desc_importance
          default: true
          selector:
            boolean:

        s2_level_no_person:
          name: "Level bei: Keine Person"
          description: *desc_level_none
          default: "passive"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s2_level_probably_person:
          name: "Level bei: Wahrscheinlich Person"
          description: *desc_level_prob
          default: "active"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s2_level_definitely_person:
          name: "Level bei: Definitiv Person"
          description: *desc_level_def
          default: "time-sensitive"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s2_gate_enable:
          name: "Gate aktivieren (Filter)"
          description: *desc_gate_enable
          default: true
          selector:
            boolean:

        s2_gate_threshold:
          name: "Gate Schwellwert"
          description: *desc_gate_thresh
          default: "active"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s2_mobile_push:
          name: "Mobile Push senden"
          default: true
          selector:
            boolean:

        s2_video_min_detection:
          name: "Video-Analyse ab Detection-Level"
          description: *desc_video_min
          default: "definitely-person"
          selector:
            select:
              options:
                - label: "Immer"
                  value: "always"
                - label: "Ab: Keine Person"
                  value: "no-person"
                - label: "Ab: Wahrscheinlich Person"
                  value: "probably-person"
                - label: "Ab: Definitiv Person"
                  value: "definitely-person"
                - label: "Nie"
                  value: "never"

        s2_tv_notify:
          name: "TV Benachrichtigung"
          default: true
          selector:
            boolean:

        s2_tts_enable:
          name: "Sprachansage (nur bei Critical)"
          description: *desc_tts
          default: false
          selector:
            boolean:

        s2_alarm_mode:
          name: "Alarm-Wiederholungen aktivieren"
          description: *desc_alarm_mode
          default: false
          selector:
            boolean:

    # =======================
    # SZENARIO 3
    # =======================
    scenario_3_section:
      name: "Szenario 3: Anwesend, tagsüber, unscharf"
      icon: mdi:weather-sunny
      collapsed: true
      input:
        s3_conditions:
          name: "Aktivierungsbedingungen"
          description: *desc_conditions
          default: []
          selector:
            condition:

        s3_snapshot:
          name: "Snapshot erstellen"
          default: true
          selector:
            boolean:

        s3_video:
          name: "Video aufnehmen"
          default: false
          selector:
            boolean:

        s3_importance_check:
          name: "Wichtigkeitsanalyse (AI)"
          description: *desc_importance
          default: false
          selector:
            boolean:

        s3_level_no_person:
          name: "Level bei: Keine Person"
          description: *desc_level_none
          default: "passive"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s3_level_probably_person:
          name: "Level bei: Wahrscheinlich Person"
          description: *desc_level_prob
          default: "passive"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s3_level_definitely_person:
          name: "Level bei: Definitiv Person"
          description: *desc_level_def
          default: "active"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s3_gate_enable:
          name: "Gate aktivieren (Filter)"
          description: *desc_gate_enable
          default: false
          selector:
            boolean:

        s3_gate_threshold:
          name: "Gate Schwellwert"
          description: *desc_gate_thresh
          default: "time-sensitive"
          selector:
            select:
              options: [passive, active, time-sensitive, critical]

        s3_mobile_push:
          name: "Mobile Push senden"
          default: true
          selector:
            boolean:

        s3_video_min_detection:
          name: "Video-Analyse ab Detection-Level"
          description: *desc_video_min
          default: "never"
          selector:
            select:
              options:
                - label: "Immer"
                  value: "always"
                - label: "Ab: Keine Person"
                  value: "no-person"
                - label: "Ab: Wahrscheinlich Person"
                  value: "probably-person"
